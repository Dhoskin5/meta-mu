# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-mu"
BBFILE_PATTERN_meta-mu = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-mu = "6"

# This is the default location for the mu-keys directory
MU_KEYS_DIR ??= "${TOPDIR}/mu-keys"

# This is the default location for the update-inbox directory
MU_UPDATE_INBOX_DIR ?= "/data/update-inbox"


LAYERDEPENDS_meta-mu = "core"
LAYERSERIES_COMPAT_meta-mu = "scarthgap"
