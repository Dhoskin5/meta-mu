<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>

  <!-- Allow root to own and access the service -->
  <policy user="root">
    <allow own="org.mu.Update"/>
    <allow send_destination="org.mu.Update"/>
    <allow send_interface="org.mu.Update"/>
    <allow send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>

  <!-- Default: allow all users to introspect and call methods -->
  <policy context="default">
    <allow send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>

</busconfig>
